# Hand-written parts of the Agent STT AsyncAPI spec.
#
# spec/agent-stt.yaml is generated from the JSON Schema files in the
# openapi-specifications repo. Those carry field definitions but no document
# metadata, no message summaries, and no binary AddAudio message. Everything
# the generator cannot derive lives here and is merged in on each run, so
# regenerating never overwrites prose.
#
# Run `npm run build:agent-stt-spec` after editing this file.

# Copied verbatim into the generated document.
info:
  title: Speechmatics Agent STT
  version: 2.0.0
  contact:
    name: Speechmatics Support
    url: "https://www.speechmatics.com/product/support/"
    email: support@speechmatics.com
  externalDocs:
    description: Agent STT Reference
    url: "https://docs.speechmatics.com/api-ref/agent-stt-websocket"

servers:
  default:
    host: global.rt.speechmatics.com
    pathname: /v2/agent
    protocol: wss
    protocolVersion: v13 (RFC 6455)
    description: |
      Routes each connection to the nearest region, for the lowest latency. To keep data in one region instead, connect to that region's endpoint, such as `wss://eu.rt.speechmatics.com/v2/agent`. See [Supported endpoints](/get-started/authentication#supported-endpoints).
    # Any one of these authenticates the connection.
    security:
      - $ref: "#/components/securitySchemes/apiKey"
      - $ref: "#/components/securitySchemes/temporaryKey"

# The one channel: the WebSocket connection. Its description heads the API
# reference page.
channel:
  id: agent
  title: Agent STT
  description: |
    Transcribe a conversation as it happens, for a voice agent, over one WebSocket connection. Open the connection and send `StartRecognition`, then stream audio as binary messages. Every other message is a JSON object that names itself in its `message` field.

    Three groups of server messages carry the conversation itself, and are the ones your agent logic acts on:

    | Group | Messages | What they mean |
    | --- | --- | --- |
    | Speech signals | `SpeechStarted`, `SpeechEnded` | Voice activity. Sent in `vad` mode only, and not turn boundaries — a mid-sentence pause ends speech without ending the turn. |
    | Segments | `AddPartialSegment`, `AddSegment` | The transcript. Each partial is a snapshot that replaces the last; `AddSegment` is final and will not change. |
    | Turn signals | `StartOfTurn`, `EndOfTurn` | Where a speaker's turn starts and ends. `EndOfTurn` is the turn's last message, and the cue for your agent to respond. |

    Pass `AddSegment` downstream to your LLM, and use `AddPartialSegment` only for display. The other server messages manage the session rather than the conversation.

securitySchemes:
  apiKey:
    type: http
    scheme: bearer
    description: Your [API key](/get-started/authentication), for server-side connections.
  temporaryKey:
    type: httpApiKey
    name: jwt
    in: query
    description: |
      A Realtime (`type=rt`) [temporary key](/get-started/authentication#temporary-keys), for connections from a browser, which cannot set the `Authorization` header — and should not hold your long-lived API key. For example, `wss://global.rt.speechmatics.com/v2/agent?jwt=<temporary-key>`.

# Fields the source JSON Schema carries that we do not want to document. They
# are dropped from the generated document, along with any `anyOf` branch or
# `allOf` rule that references them.
omitProperties:
  TranscriptionConfig:
    - operating_point

# Overrides for source descriptions that are wrong for Agent STT — usually
# because the upstream text refers to an omitted field.
descriptions:
  TranscriptionConfig:
    model: The model to use for transcription. Agent STT is powered by `linden-1`.

# Messages absent from the source JSON Schema, because they are not JSON, by
# who sends them. `after` places the message after the named one.
extraMessages:
  client:
    AddAudio:
      after: StartRecognition
      summary: A binary chunk of audio. The server confirms receipt by sending an AudioAdded message.
      contentType: application/octet-stream
      schema:
        type: string
        format: binary

# Message summaries, rendered above each schema on the API reference page.
# A message with no entry here falls back to the `description` on its source
# schema; the generator warns for any message left with neither.
summaries:
  # Sent messages
  StartRecognition: Initiates a new recognition session.
  EndOfStream: Declares that the client has no more audio to send.
  SetRecognitionConfig: |
    Allows the client to re-configure the recognition session.

    :::note

    The `language` field can be included in SetRecognitionConfig, but its value must match the language specified in the initial StartRecognition message.
    Attempting to change the language or any other transcription configuration parameter not listed below will result in an error.

    :::
  GetSpeakers: Requests any detected speaker identifiers to be returned.
  ForceEndOfUtterance: |
    Closes the current speaker turn. The transcript up to `timestamp` is flushed as an `AddSegment`, followed by `EndOfTurn`.

    :::note

    Supported only with `turn_config.turn_detection_mode: external`, where the client detects turn ends itself.
    In the default `vad` mode the service closes turns from voice activity.

    :::

  # Received messages
  RecognitionStarted: Server response to StartRecognition, acknowledging that a recognition session has started.
  AudioAdded: |
    Server response to AddAudio, indicating that audio has been added successfully.

    :::info

    When clients send audio faster than real-time, the server may read data slower than it's sent. If binary `AddAudio` messages exceed the server's internal buffer, the server will process other WebSocket messages until buffer space is available. Clients receive `AudioAdded` responses only after binary data is read. This can fill TCP buffers, potentially causing WebSocket write failures and connection closure [with prejudice](https://websockets.spec.whatwg.org#the-closeevent-interface). Clients can monitor the WebSocket's [`bufferedAmount`](https://www.w3.org/TR/websockets#dom-websocket-bufferedamount) attribute to prevent this.

    :::
  EndOfTranscript: Server response to EndOfStream, sent after the server has finished sending all segment messages.
  SpeakersResult: Server response to GetSpeakers, returning any detected speaker identifiers.
  Info: Additional information sent from the server to the client.
  Warning: Warning messages sent from the server to the client.
  Error: Error messages sent from the server to the client. After any error, transcription is terminated and the connection is closed.
